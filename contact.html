<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Lugha Gateway</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    animation: { float: 'float 6s ease-in-out infinite' },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                } 
            } 
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Custom Glowing Cursor */
        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.3);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.6);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: width 0.2s, height 0.2s;
            mix-blend-mode: multiply;
        }
        @media (pointer: coarse) {
            #custom-cursor { display: none !important; }
        }

        /* Better styling for the select dropdown */
        select optgroup {
            font-weight: 800;
            color: #1e293b; /* slate-800 */
            background: #f8fafc; /* slate-50 */
        }
        select option {
            font-weight: 600;
            color: #475569; /* slate-600 */
            padding: 8px;
            background: #ffffff;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans overflow-x-hidden selection:bg-blue-200 selection:text-blue-900 relative">

    <div id="custom-cursor"></div>

    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-100 rounded-full blur-[100px] opacity-50 -translate-y-1/2 translate-x-1/3 animate-float pointer-events-none"></div>

    <nav class="py-6 border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 font-extrabold text-xl group">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg group-hover:-translate-x-1 transition-transform shadow-md shadow-blue-600/20">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </div>
                <span class="text-slate-800 hover:text-blue-600 transition-colors">Back to Home</span>
            </a>
            <span class="text-blue-600 font-bold text-sm tracking-wide uppercase">Project Inquiry</span>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-6 py-16 relative z-10">
        <div data-aos="fade-down" class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">Start Your Project</h1>
            <p class="text-lg text-slate-600">Tell us about your localization needs. We usually reply within 2 hours.</p>
        </div>

        <form data-aos="fade-up" data-aos-delay="100" action="https://formspree.io/f/xreagnby" method="POST" class="bg-white p-8 md:p-12 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 space-y-6">
            
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-extrabold text-slate-700 mb-2 tracking-wide uppercase">Full Name</label>
                    <input type="text" name="name" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-semibold text-slate-800 placeholder-slate-400" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-extrabold text-slate-700 mb-2 tracking-wide uppercase">Business Email</label>
                    <input type="email" name="email" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-semibold text-slate-800 placeholder-slate-400" placeholder="john@company.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-extrabold text-slate-700 mb-2 tracking-wide uppercase">Service Needed</label>
                <div class="relative">
                    <select name="service" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-semibold text-slate-800 appearance-none cursor-pointer">
                        <option value="" disabled selected>-- Select a primary service --</option>
                        
                        <optgroup label="Core Language Services">
                            <option value="Translation (general and specialized)">Translation (general & specialized)</option>
                            <option value="Editing and proofreading">Editing and proofreading</option>
                            <option value="Revision and quality assurance (QA)">Revision and quality assurance (QA)</option>
                            <option value="Transcreation and creative adaptation">Transcreation & creative adaptation</option>
                            <option value="Localization (apps, websites, software)">Localization (apps, websites, software)</option>
                            <option value="Linguistic and in-context review">Linguistic & in-context review</option>
                        </optgroup>
                        
                        <optgroup label="Specialized & Industry Services">
                            <option value="Life sciences / medical translation">Life sciences / medical translation</option>
                            <option value="Legal and regulatory translation">Legal and regulatory translation</option>
                            <option value="Technical and IT translation">Technical and IT translation</option>
                            <option value="Marketing and brand localization">Marketing and brand localization</option>
                            <option value="UX/UI and product localization">UX/UI and product localization</option>
                            <option value="AI, data, and LLM-related language tasks">AI, data, and LLM language tasks</option>
                        </optgroup>

                        <optgroup label="Testing & Evaluation">
                            <option value="Linguistic testing">Linguistic testing</option>
                            <option value="Functional and localization testing">Functional and localization testing</option>
                            <option value="UX and usability testing">UX and usability testing</option>
                            <option value="Regression testing for localized content">Regression testing for localized content</option>
                            <option value="Bug reporting and validation">Bug reporting and validation</option>
                            <option value="Feature testing for digital platforms">Feature testing for digital platforms</option>
                        </optgroup>

                        <optgroup label="Content & Language Support">
                            <option value="Terminology management & glossary creation">Terminology management & glossary creation</option>
                            <option value="Style guide development">Style guide development</option>
                            <option value="Language quality evaluation (LQE)">Language quality evaluation (LQE)</option>
                            <option value="Content review and language audits">Content review and language audits</option>
                            <option value="Multilingual content adaptation">Multilingual content adaptation</option>
                        </optgroup>

                        <optgroup label="Platform & Workflow Support">
                            <option value="CAT tool–based translation">CAT tool–based translation (XTM, MemoQ, etc.)</option>
                            <option value="MT post-editing (light and full)">MT post-editing (light and full)</option>
                            <option value="Collaborative translation workflows">Collaborative translation workflows</option>
                            <option value="Compliance with client KPIs">Compliance with client KPIs</option>
                        </optgroup>

                        <optgroup label="Additional Services">
                            <option value="Subtitling and captioning">Subtitling and captioning</option>
                            <option value="Transcription">Transcription</option>
                            <option value="Voice-over script adaptation">Voice-over script adaptation</option>
                            <option value="Cultural consulting & market adaptation">Cultural consulting & market adaptation</option>
                            <option value="Other">Other / Multiple Services</option>
                        </optgroup>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-extrabold text-slate-700 mb-2 tracking-wide uppercase">Project Details</label>
                <p class="text-xs text-slate-500 mb-2 font-semibold">Please include language pairs, estimated volume, and deadline.</p>
                <textarea name="message" rows="5" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-semibold text-slate-800 placeholder-slate-400" placeholder="Hello, we are looking to localize our app into Swahili and Hausa..."></textarea>
            </div>

            <button type="submit" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white text-lg font-extrabold rounded-xl transition-all duration-300 shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 hover:-translate-y-1 flex justify-center items-center gap-3 group">
                Send Request <i data-lucide="send" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
            </button>
            
            <p class="text-center text-xs text-slate-400 font-bold mt-4"><i data-lucide="lock" class="w-3 h-3 inline pb-0.5"></i> Your information is secure and encrypted.</p>
        </form>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Init animations
        AOS.init({
            duration: 800,        
            easing: 'ease-out-cubic', 
            once: true, 
            offset: 50,          
        });

        // Init Icons
        lucide.createIcons();

        // Custom Cursor Follower
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mousedown', () => cursor.style.transform = 'translate(-50%, -50%) scale(0.8)');
        document.addEventListener('mouseup', () => cursor.style.transform = 'translate(-50%, -50%) scale(1)');
    </script>
</body>
</html>
