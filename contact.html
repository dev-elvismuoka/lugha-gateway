<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Lugha Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <nav class="py-6 border-b border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg"><i data-lucide="arrow-left" class="w-5 h-5"></i></div>
                Back to Home
            </a>
            <span class="text-slate-500 font-semibold text-sm">Project Inquiry</span>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-4">Start Your Project</h1>
            <p class="text-slate-600">Tell us about your localization needs. We usually reply within 2 hours.</p>
        </div>

        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-100">
            
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Full Name</label>
                    <input type="text" name="name" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Business Email</label>
                    <input type="email" name="email" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">Service Needed</label>
                <select name="service" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 outline-none">
                    <option>Translation & Localization</option>
                    <option>Interpretation (Live)</option>
                    <option>AI / Data Collection</option>
                    <option>Legal Certification</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">Project Details (Language pairs, volume, deadline)</label>
                <textarea name="message" rows="4" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-500 outline-none"></textarea>
            </div>

            <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-600/20 flex justify-center items-center gap-2">
                Send Request <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
